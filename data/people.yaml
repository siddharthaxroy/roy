# PEOPLE — three groups: graduate, undergraduate, alumni (alphabetical by last name).
# To add someone, copy a block within the right group. Put the photo in content/people/.
# Fields: name (required); photo, field, role, bio (optional)

graduate:

  - name: Eve Butterworth
    photo: eve-butterworth.jpg
    field: Environmental Science
    role: PhD Student
    bio: Eve is a first-year PhD student who graduated from Wellesley College with a BA in Geosciences. She researches urban water contamination in New Jersey, including lead in schools and contaminants following natural disasters. She is passionate about environmental justice and building relationships between the lab and at-risk communities.

  - name: Gael (Jennie) Fleurant
    photo: jennie-fleurant.jpg
    field: Environmental Science
    role: PhD Student
    bio: Jennie's research focuses on drinking water quality, with emphasis on corrosion and metal leaching in decentralized water systems. She aims to improve understanding of corrosion processes and inform safer material choices for drinking water systems in low- and middle-income countries. Her interests include water treatment and sustainable safe drinking water access.

undergraduate:

   - name: Charlene Guo
    photo: charlene-guo.jpg
    field: Environmental Science
    role: Honors Thesis Research
    bio: Charlene is a junior majoring in Environmental Science interested in water quality management, heavy metal contamination, and the intersection of environmental pollutants and human health. Her current project focuses on lead exposure from contaminated spices and its implications for public health using biokinetic modeling.

   - name: Dan Mayster
    photo: dan-mayster.jpg
    field: Data Science & Economics
    role: Aresty Research Assistant
    bio: Dan is a third-year student studying Data Science and Economics. He is interested in deriving insights from data in the fields of public health and finance. He is excited to help track water lead remediation efforts in New Jersey public schools.

alumni:

  - name: Emily Newton
    photo: emily-newton.jpg
    field: Environmental Science
    role: Masters Student
    bio: Emily is a master's student in Environmental Science with a bachelor's degree in Forensic Science. She is passionate about forensic environmental science and entomology, particularly its relevance to contamination investigations. This year, she will focus on one contamination event to give it thorough analytical attention.

  - name: Aanand Aggarwal
    photo: aanand-aggarwal.jfif
    field: Data Science
    role: Graduate Researcher
    bio: Aanand is pursuing a Master of Information in Data Science at Rutgers University with dual bachelor's degrees in Computer Science and IT & Informatics. His research utilizes Python and AI/ML techniques to automate the classification of corrosion images. He plans to apply this background in the health tech sector, addressing challenges in medical diagnostics and health equity.

